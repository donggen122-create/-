# 실서버 배포(휴대폰에서도): seoho-game 최신 커밋으로 deploy/<아무 이름> 브랜치를 만들면 검사 → 마지막 배포 확인 → dist_web 동기화 → wrangler deploy → 기록 커밋 → 그 브랜치 삭제.
# Claude에게 "배포해"라고 하거나, GitHub 웹(휴대폰 가능)에서 seoho-game 기준으로 deploy/날짜 브랜치를 만든다.
# deploy-force/<이름>은 마지막 배포가 기록과 달라도(Codex 배포를 합친 뒤) 배포한다.
# 필요한 저장소 비밀값: CLOUDFLARE_API_TOKEN(Workers 편집 권한, 선생님은 CLOUDFLARE 이름으로 넣음 — 둘 다 읽는다). CLOUDFLARE_ACCOUNT_ID는 토큰이 계정 하나만 볼 때는 없어도 된다.
# (기본 브랜치 main은 다른 프로젝트라 "Run workflow" 버튼 대신 브랜치로 시작한다. 이 작업 환경은 태그 올리기가 막혀 있다.)
name: Seoho deploy
on:
  push:
    branches: ['deploy/**', 'deploy-force/**']
permissions:
  contents: write
concurrency:
  group: seoho-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRIGGER: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 배포 연결·대상 확인
        run: |
          # 값은 절대 출력하지 않고 "있음/없음"만 알려 준다(어디에 잘못 넣었는지 찾기용).
          echo "저장소 비밀값(Actions → Secrets) CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && '있음' || '없음' }}"
          echo "비슷한 이름의 비밀값(CLOUDFLARE·CF_API_TOKEN·CLOUDFLARE_TOKEN·CLOUDFLARE_API_KEY): ${{ (secrets.CLOUDFLARE != '' || secrets.CF_API_TOKEN != '' || secrets.CLOUDFLARE_TOKEN != '' || secrets.CLOUDFLARE_API_KEY != '') && '있음' || '없음' }}"
          echo "변수(Actions → Variables) CLOUDFLARE_API_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN != '' && '있음 — 비밀값(Secrets)으로 옮기고 변수는 지워 주세요' || '없음' }}"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::배포 열쇠가 없어요. GitHub 저장소 Settings → Secrets and variables → Actions → Secrets 탭 → Repository secrets에 CLOUDFLARE_API_TOKEN 이름으로 넣어 주세요(Environments·Codespaces·Dependabot·Variables가 아님)."; exit 1; fi
          git fetch -q origin seoho-game
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/seoho-game)" ]; then echo "::error::배포 브랜치가 seoho-game 최신 커밋이 아니에요. seoho-game 최신 커밋으로 다시 만들어 주세요."; exit 1; fi
      - name: 검사
        run: node --test tests/*.test.mjs
      - name: 배포 도구 설치
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: 마지막 배포 확인(check-live)
        run: node game/tools/ci-deploy.mjs check ${{ startsWith(github.ref_name, 'deploy-force/') }}
      - name: dist_web 동기화
        run: node game/tools/ci-deploy.mjs sync
      - name: 배포
        working-directory: server
        run: |
          set -o pipefail
          npx wrangler deploy --message "github $TRIGGER" 2>&1 | tee ../deploy-output.txt
      - name: 배포 버전 기록·실서버 확인
        run: |
          node game/tools/ci-deploy.mjs record deploy-output.txt
          node game/tools/ci-deploy.mjs health
      - name: 기록을 seoho-game에 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp server/.last_deploy_version /tmp/last_deploy_version
          tar -cf /tmp/share.tar dist_web/share
          for i in 1 2 3; do
            git fetch -q origin seoho-game && git checkout -q -B seoho-game origin/seoho-game
            cp /tmp/last_deploy_version server/.last_deploy_version && tar -xf /tmp/share.tar
            git add server/.last_deploy_version dist_web/share
            git diff --cached --quiet || git commit -q -m "deploy: $(cat server/.last_deploy_version) ($TRIGGER)"
            if git push -q origin seoho-game; then
              # 배포 시작용 브랜치 정리(이번 것 + 전에 실패해서 남은 것). Claude 작업 환경은 브랜치를 지우지 못한다.
              for b in $(git ls-remote --heads origin 'deploy/*' 'deploy-force/*' | sed 's#.*refs/heads/##'); do git push -q origin --delete "$b" || true; done
              exit 0
            fi
            sleep 5
          done
          echo "::error::배포는 끝났지만 기록 커밋을 올리지 못했어요. server/.last_deploy_version을 직접 올려 주세요."; exit 1
