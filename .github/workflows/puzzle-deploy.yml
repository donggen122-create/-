# 명화 퍼즐 웹 배포: puzzle-game 브랜치에 mom-brain-games/ 가 바뀌어 올라오면
# 검사(npm test) → dist 만들기 → Cloudflare Pages(mompuzzle)에 배포 → 주소 확인.
# 주소: https://mompuzzle.pages.dev
# 필요한 저장소 비밀값: CLOUDFLARE_API_TOKEN. seoho-game 배포와 같은 토큰이라
# 그쪽처럼 CLOUDFLARE 등 비슷한 이름도 함께 읽어요. 값은 출력하지 않아요.
name: Puzzle deploy
on:
  push:
    branches: [puzzle-game]
    paths: ['mom-brain-games/**', '.github/workflows/puzzle-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: puzzle-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mom-brain-games
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: mompuzzle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mom-brain-games/package-lock.json
      - name: 배포 열쇠 확인
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::배포 열쇠가 없어요. 저장소 Settings → Secrets and variables → Actions → Repository secrets에 CLOUDFLARE_API_TOKEN 이름으로 넣어 주세요."
            exit 1
          fi
      - name: 설치
        run: npm ci --no-audit --no-fund
      - name: 검사
        run: npm test
      - name: 배포
        run: |
          set -o pipefail
          node tools/build-web.mjs
          # Pages 프로젝트가 없으면 만들어요(있으면 그냥 넘어가요)
          npx wrangler pages project create "$PROJECT" --production-branch=main 2>&1 | tail -3 || true
          # git 브랜치(puzzle-game) 대신 main 으로 올려야 미리보기가 아니라 실제 주소에 반영돼요
          npx wrangler pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true --commit-message="github ${GITHUB_SHA::7}" 2>&1 | tee deploy-output.txt
      - name: 게임 주소 확인
        run: |
          DOMAIN=$(npx wrangler pages project list 2>/dev/null | grep -E "(^|[^a-z0-9-])$PROJECT([^a-z0-9-]|$)" | grep -oE "[a-z0-9-]+\.pages\.dev" | head -1)
          URL="https://${DOMAIN:-$PROJECT.pages.dev}"
          echo "게임 주소: $URL"
          echo "### 게임 주소: $URL" >> "$GITHUB_STEP_SUMMARY"
          # 새 주소는 열리기까지 조금 걸릴 수 있어서 몇 번 다시 확인해요
          for i in $(seq 1 18); do
            if curl -fsS -o /dev/null "$URL/" && curl -fsS -o /dev/null "$URL/js/app.js"; then echo "주소가 열려요"; exit 0; fi
            sleep 10
          done
          echo "::error::배포 뒤 3분이 지나도 $URL 이 열리지 않아요."
          exit 1
      - name: 예전 긴 주소 정리
        # 처음에 Workers 로 올렸던 masterpiece-puzzle(긴 주소)을 지워요. 이미 없으면 그냥 넘어가요.
        working-directory: .
        run: mom-brain-games/node_modules/.bin/wrangler delete --name masterpiece-puzzle --force 2>&1 | tail -3 || true
