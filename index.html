<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>테트리스</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>테트리스</h1>
        <p class="tagline">EXP를 모아 레벨을 올리고 특별 규칙을 해금하세요</p>
      </header>

      <div class="layout">
        <section class="side-panel left">
          <div class="box">
            <h2>HOLD</h2>
            <canvas id="hold-canvas" width="96" height="96"></canvas>
          </div>
          <div class="box level-box">
            <h2>PLAYER LV</h2>
            <p class="lv-value" id="player-level">1</p>
            <div class="exp-bar"><div class="exp-fill" id="exp-fill"></div></div>
            <p class="exp-text" id="exp-text">0 / 100</p>
          </div>
          <div class="box stats">
            <h2>SCORE</h2>
            <p id="score">0</p>
            <h2>STAGE</h2>
            <p id="stage">1</p>
            <h2>LINES</h2>
            <p id="lines">0</p>
            <h2>COMBO</h2>
            <p id="combo">-</p>
          </div>
        </section>

        <section class="board-wrap">
          <canvas id="board" width="240" height="480"></canvas>
          <div id="overlay" class="overlay">
            <div class="overlay-content">
              <h2 id="overlay-title">테트리스</h2>
              <p id="overlay-message">시작하려면 버튼을 누르거나 스페이스바를 누르세요</p>
              <button id="start-btn">시작 (Space)</button>
            </div>
          </div>
        </section>

        <section class="side-panel right">
          <div class="box">
            <h2>NEXT</h2>
            <canvas id="next-canvas" width="96" height="300"></canvas>
          </div>
        </section>
      </div>

      <section class="controls-info">
        <h2>조작법</h2>
        <ul>
          <li><b>←/→</b> 이동</li>
          <li><b>↓</b> 소프트 드롭</li>
          <li><b>↑ / X</b> 시계 방향 회전</li>
          <li><b>Z</b> 반시계 방향 회전</li>
          <li><b>Space</b> 하드 드롭</li>
          <li><b>C</b> 홀드</li>
          <li><b>P</b> 일시정지</li>
        </ul>
      </section>

      <section class="perks-info">
        <h2>특별 규칙 (레벨업으로 해금)</h2>
        <ul id="perks-list"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
