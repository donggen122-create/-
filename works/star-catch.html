<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>별똥별 받기</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1030;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const FONT = '"Jua", "Malgun Gothic", sans-serif';
      let W = 0;
      let H = 0;

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener("resize", resize);
      resize();

      const sky = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + 0.4, t: Math.random() * 6 }));
      const basket = { x: W / 2, w: 96 };
      const keys = {};
      let items = [];
      let pops = [];
      let score = 0;
      let lives = 3;
      let speed = 1;
      let spawnIn = 0;
      let flash = 0;
      let time = 0;
      let state = "ready";
      let best = 0;
      try {
        best = Number(localStorage.getItem("star-catch-best")) || 0;
      } catch (e) {}

      function start() {
        items = [];
        pops = [];
        score = 0;
        lives = 3;
        speed = 1;
        spawnIn = 0;
        state = "play";
      }

      function gameOver() {
        state = "over";
        if (score > best) {
          best = score;
          try {
            localStorage.setItem("star-catch-best", String(best));
          } catch (e) {}
        }
      }

      window.addEventListener("keydown", (e) => {
        keys[e.key] = true;
        if (e.key.startsWith("Arrow") || e.key === " ") e.preventDefault();
        if ((e.key === " " || e.key === "Enter") && state !== "play") start();
      });
      window.addEventListener("keyup", (e) => (keys[e.key] = false));
      canvas.addEventListener("pointermove", (e) => (basket.x = e.clientX));
      canvas.addEventListener("pointerdown", (e) => {
        basket.x = e.clientX;
        if (state !== "play") start();
      });

      function spawn() {
        const roll = Math.random();
        const kind = roll < 0.2 + Math.min(0.15, speed * 0.02) ? "bomb" : roll > 0.92 ? "gold" : "star";
        items.push({ x: 24 + Math.random() * (W - 48), y: -30, vy: (130 + Math.random() * 90) * speed, kind, spin: Math.random() * 6 });
      }

      function update(dt) {
        time += dt;
        flash = Math.max(0, flash - dt);
        pops.forEach((p) => {
          p.t -= dt;
          p.y -= 40 * dt;
        });
        pops = pops.filter((p) => p.t > 0);
        if (state !== "play") return;

        if (keys.ArrowLeft) basket.x -= 560 * dt;
        if (keys.ArrowRight) basket.x += 560 * dt;
        basket.x = Math.max(basket.w / 2, Math.min(W - basket.w / 2, basket.x));

        speed += dt * 0.03;
        spawnIn -= dt;
        if (spawnIn <= 0) {
          spawn();
          spawnIn = Math.max(0.28, 0.9 - speed * 0.12);
        }

        const by = H - 64;
        items.forEach((it) => {
          it.y += it.vy * dt;
          it.spin += dt * 3;
          if (!it.done && Math.abs(it.y - by) < 26 && Math.abs(it.x - basket.x) < basket.w / 2) {
            it.done = true;
            if (it.kind === "bomb") {
              lives -= 1;
              flash = 0.35;
              pops.push({ x: it.x, y: by - 40, text: "앗!", t: 0.8, color: "#ff6b6b" });
              if (lives <= 0) gameOver();
            } else {
              const gain = it.kind === "gold" ? 5 : 1;
              score += gain;
              pops.push({ x: it.x, y: by - 40, text: `+${gain}`, t: 0.8, color: "#ffe066" });
            }
          }
        });
        items = items.filter((it) => !it.done && it.y < H + 40);
      }

      function text(str, x, y, size, color, align = "center") {
        ctx.font = `${size}px ${FONT}`;
        ctx.textAlign = align;
        ctx.textBaseline = "middle";
        ctx.lineWidth = Math.max(3, size / 8);
        ctx.strokeStyle = "rgba(10, 14, 40, 0.8)";
        ctx.strokeText(str, x, y);
        ctx.fillStyle = color;
        ctx.fillText(str, x, y);
      }

      function draw() {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, "#0b1030");
        g.addColorStop(1, "#3b2a78");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        sky.forEach((s) => {
          ctx.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(time * 1.5 + s.t));
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;

        ctx.fillStyle = "#2a1f5c";
        ctx.fillRect(0, H - 24, W, 24);

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        items.forEach((it) => {
          ctx.save();
          ctx.translate(it.x, it.y);
          ctx.rotate(it.kind === "bomb" ? 0 : Math.sin(it.spin) * 0.4);
          ctx.font = `${it.kind === "gold" ? 44 : 36}px sans-serif`;
          ctx.fillText(it.kind === "bomb" ? "💣" : it.kind === "gold" ? "🌟" : "⭐", 0, 0);
          ctx.restore();
        });

        ctx.font = "64px sans-serif";
        ctx.fillText("🧺", basket.x, H - 60);

        pops.forEach((p) => {
          ctx.globalAlpha = Math.min(1, p.t * 2);
          text(p.text, p.x, p.y, 26, p.color);
        });
        ctx.globalAlpha = 1;

        text(`⭐ ${score}`, 20, 34, 30, "#ffe066", "left");
        text(`최고 ${best}`, 20, 70, 20, "#c9c3ff", "left");
        ctx.font = "26px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText("❤️".repeat(Math.max(0, lives)) + "🤍".repeat(Math.max(0, 3 - lives)), W - 18, 36);

        if (flash > 0) {
          ctx.fillStyle = `rgba(255, 60, 60, ${flash})`;
          ctx.fillRect(0, 0, W, H);
        }

        if (state !== "play") {
          ctx.fillStyle = "rgba(8, 10, 30, 0.55)";
          ctx.fillRect(0, 0, W, H);
          const big = Math.min(64, W / 7);
          if (state === "ready") {
            text("🌠 별똥별 받기 🌠", W / 2, H / 2 - 60, big, "#ffe066");
            text("⭐를 받고 💣는 피하세요!", W / 2, H / 2 + 6, big * 0.45, "#fff");
          } else {
            text("게임 끝!", W / 2, H / 2 - 60, big, "#ff9f9f");
            text(`받은 별: ${score}개   최고 기록: ${best}개`, W / 2, H / 2 + 6, big * 0.45, "#fff");
          }
          text("화면을 누르거나 스페이스 키를 눌러 시작", W / 2, H / 2 + 62, big * 0.36, "#c9c3ff");
        }
      }

      let last = performance.now();
      function loop(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
