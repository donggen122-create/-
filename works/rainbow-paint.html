<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>무지개 그림판</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "Jua", "Malgun Gothic", sans-serif;
        background: #fdf6e3;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .tools h1 {
        margin: 0 10px 0 0;
        font-size: 22px;
        font-weight: 400;
        color: #7b4bd6;
      }
      .swatch {
        width: 32px;
        height: 32px;
        border: 3px solid #fff;
        border-radius: 50%;
        box-shadow: 0 0 0 2px #ddd;
        cursor: pointer;
      }
      .swatch.on {
        box-shadow: 0 0 0 3px #333;
      }
      .rainbow {
        background: conic-gradient(red, orange, yellow, lime, cyan, blue, violet, red);
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 16px;
      }
      button.act {
        padding: 6px 14px;
        border: 0;
        border-radius: 10px;
        background: #ffe8a3;
        font: inherit;
        font-size: 16px;
        cursor: pointer;
      }
      button.act:hover {
        background: #ffd966;
      }
      canvas {
        flex: 1;
        width: 100%;
        min-height: 0;
        background: #fff;
        cursor: crosshair;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div class="tools">
      <h1>🌈 무지개 그림판</h1>
      <div id="swatches" style="display: flex; gap: 6px"></div>
      <label>굵기 <input id="size" type="range" min="2" max="48" value="12" /></label>
      <button class="act" id="eraser">🧽 지우개</button>
      <button class="act" id="clear">🗑️ 모두 지우기</button>
      <button class="act" id="save">💾 저장</button>
    </div>
    <canvas id="board"></canvas>
    <script>
      const board = document.getElementById("board");
      const ctx = board.getContext("2d");
      const colors = ["rainbow", "#222222", "#ff4d4d", "#ffa94d", "#ffd43b", "#51cf66", "#339af0", "#845ef7", "#f783ac"];
      let color = "rainbow";
      let erasing = false;
      let hue = 0;
      let drawing = false;
      let last = null;

      function fit() {
        const snapshot = board.width ? ctx.getImageData(0, 0, board.width, board.height) : null;
        board.width = board.clientWidth;
        board.height = board.clientHeight;
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, board.width, board.height);
        if (snapshot) ctx.putImageData(snapshot, 0, 0);
      }
      window.addEventListener("resize", fit);
      fit();

      const swatches = document.getElementById("swatches");
      colors.forEach((c) => {
        const b = document.createElement("button");
        b.className = "swatch" + (c === "rainbow" ? " rainbow" : "") + (c === color ? " on" : "");
        if (c !== "rainbow") b.style.background = c;
        b.title = c === "rainbow" ? "무지개" : c;
        b.onclick = () => {
          color = c;
          erasing = false;
          swatches.querySelectorAll(".swatch").forEach((s) => s.classList.toggle("on", s === b));
        };
        swatches.appendChild(b);
      });

      function point(e) {
        const r = board.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }

      function stroke(from, to) {
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = Number(document.getElementById("size").value) * (erasing ? 2 : 1);
        if (erasing) ctx.strokeStyle = "#fff";
        else if (color === "rainbow") ctx.strokeStyle = `hsl(${(hue = (hue + 4) % 360)}, 90%, 55%)`;
        else ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
        ctx.stroke();
      }

      board.addEventListener("pointerdown", (e) => {
        drawing = true;
        last = point(e);
        board.setPointerCapture(e.pointerId);
        stroke(last, last);
      });
      board.addEventListener("pointermove", (e) => {
        if (!drawing) return;
        const p = point(e);
        stroke(last, p);
        last = p;
      });
      ["pointerup", "pointercancel"].forEach((t) => board.addEventListener(t, () => (drawing = false)));

      document.getElementById("eraser").onclick = () => (erasing = !erasing);
      document.getElementById("clear").onclick = () => {
        if (!confirm("그림을 모두 지울까요?")) return;
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, board.width, board.height);
      };
      document.getElementById("save").onclick = () => {
        const a = document.createElement("a");
        a.download = "내-그림.png";
        a.href = board.toDataURL("image/png");
        a.click();
      };
    </script>
  </body>
</html>
