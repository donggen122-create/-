<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>구구단 스피드 퀴즈</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "Jua", "Malgun Gothic", sans-serif;
        background: linear-gradient(160deg, #d3f9d8, #a5d8ff);
        color: #1f3b4d;
      }
      .box {
        max-width: 520px;
        margin: 0 auto;
        padding: 28px 18px;
        text-align: center;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 38px;
        font-weight: 400;
      }
      .dans {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin: 18px 0;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
      }
      .dans button {
        width: 64px;
        height: 52px;
        border-radius: 14px;
        background: #fff;
        font-size: 20px;
        box-shadow: 0 4px 0 #74c0fc;
      }
      .dans button:hover {
        background: #fff3bf;
      }
      .q {
        margin: 26px 0 18px;
        font-size: 64px;
      }
      .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .choices button {
        padding: 16px;
        border-radius: 18px;
        background: #fff;
        font-size: 32px;
        box-shadow: 0 5px 0 #74c0fc;
      }
      .choices button.good {
        background: #b2f2bb;
      }
      .choices button.bad {
        background: #ffc9c9;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        font-size: 20px;
      }
      .big {
        font-size: 80px;
      }
      .again {
        margin-top: 18px;
        padding: 12px 26px;
        border-radius: 999px;
        background: #339af0;
        color: #fff;
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <div class="box" id="app"></div>
    <script>
      const app = document.getElementById("app");
      const TOTAL = 10;
      let quiz = null;

      function home() {
        const dans = [2, 3, 4, 5, 6, 7, 8, 9].map((d) => `<button data-dan="${d}">${d}단</button>`).join("");
        app.innerHTML = `
          <h1>✖️ 구구단 스피드 퀴즈</h1>
          <p>몇 단을 연습할까요? 10문제를 빠르게 풀어 봐요!</p>
          <div class="dans">${dans}<button data-dan="0" style="width:140px">🎲 섞어서</button></div>`;
        app.querySelectorAll("[data-dan]").forEach((b) => (b.onclick = () => start(Number(b.dataset.dan))));
      }

      function start(dan) {
        quiz = { dan, n: 0, right: 0, started: performance.now() };
        next();
      }

      function next() {
        if (quiz.n >= TOTAL) return finish();
        const a = quiz.dan || 2 + Math.floor(Math.random() * 8);
        const b = 1 + Math.floor(Math.random() * 9);
        const answer = a * b;
        const options = new Set([answer]);
        while (options.size < 4) {
          const wrong = answer + (Math.floor(Math.random() * 7) - 3) * (Math.random() < 0.5 ? 1 : a);
          if (wrong > 0 && wrong !== answer) options.add(wrong);
        }
        const shuffled = [...options].sort(() => Math.random() - 0.5);
        app.innerHTML = `
          <div class="bar"><span>${quiz.n + 1} / ${TOTAL}</span><span>⭕ ${quiz.right}</span></div>
          <div class="q">${a} × ${b} = ?</div>
          <div class="choices">${shuffled.map((o) => `<button data-v="${o}">${o}</button>`).join("")}</div>`;
        app.querySelectorAll("[data-v]").forEach(
          (btn) =>
            (btn.onclick = () => {
              const ok = Number(btn.dataset.v) === answer;
              btn.classList.add(ok ? "good" : "bad");
              if (!ok) app.querySelector(`[data-v="${answer}"]`).classList.add("good");
              if (ok) quiz.right += 1;
              quiz.n += 1;
              app.querySelectorAll("[data-v]").forEach((x) => (x.disabled = true));
              setTimeout(next, ok ? 350 : 900);
            }),
        );
      }

      function finish() {
        const sec = ((performance.now() - quiz.started) / 1000).toFixed(1);
        const face = quiz.right === TOTAL ? "🏆" : quiz.right >= 7 ? "😄" : "💪";
        app.innerHTML = `
          <div class="big">${face}</div>
          <h1>${TOTAL}문제 중 ${quiz.right}개 정답!</h1>
          <p>걸린 시간: ${sec}초</p>
          <button class="again" id="again">다시 하기</button>`;
        document.getElementById("again").onclick = home;
      }

      home();
    </script>
  </body>
</html>
